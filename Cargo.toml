[package]
name = "charlie"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.65"
nfc1 = { version = "0.4.1", vendored = false }
ouroboros = "0.15.5"
phf = { version = "0.11.1", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
strum = "0.24.1"
strum_macros = "0.24.3"
thiserror = "1.0.38"
time = { version = "0.3.11", features = ["macros", "formatting", "serde"] }
time-tz = "1.0.2"
