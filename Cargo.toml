[package]
name = "charlie"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.65"
nfc1 = { version = "0.4.1", vendored = false }
ouroboros = "0.15.5"
serde = { version = "1.0.145", features = ["derive"] }
time = { version = "0.3.11", features = ["macros", "formatting", "serde"] }

